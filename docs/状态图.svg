<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1500" viewBox="0 0 1360 1500" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1360" height="1500" fill="#ffffff"/>

  <text x="40" y="36" font-size="21" font-weight="bold" fill="#111">UEMCP 全流程状态图 —— 8 个阶段 / 19 个工具 / 12 道闸（G1~G12）</text>
  <text x="40" y="58" font-size="12" fill="#666">2026-09-30 · 左列 = 状态的推进；右列 = 这一阶段用的工具、压着的闸、留下的产物。闸的细节见 `docs/全流程-闸门地图.md`</text>
  <text x="40" y="78" font-size="11" fill="#a60" font-weight="bold">⚠ 全程**绝不存盘**：19 个工具只改关卡内存状态；"要不要落盘"永远是人在 UE 里的动作。　⚠ 本图按**阶段**列判据、**不给编号**（编号只有一套：地图里的 G1~G12）。</text>

  <!-- ============ 阶段一 ============ -->
  <rect x="50" y="100" width="280" height="140" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="66" y="126" font-size="15" font-weight="bold" fill="#1a73e8">阶段一 · 资产确认</text>
  <text x="66" y="150" font-size="11" fill="#333">参考图 → 元素清单</text>
  <text x="66" y="168" font-size="11" fill="#333">→ 找资产 → 使用清单</text>
  <text x="66" y="194" font-size="11" fill="#777">两个"人点头"：</text>
  <text x="66" y="212" font-size="11" fill="#777">元素清单 / 资产清单</text>
  <text x="66" y="232" font-size="11" fill="#137333" font-weight="bold">产物：catalog/ 三份表</text>

  <rect x="350" y="100" width="970" height="140" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="122" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="142" font-size="11" fill="#333">`confirm_elements` · `plan_assets` · `rename_assets` · `confirm_assets` · `get_asset_list`</text>
  <text x="366" y="166" font-size="12" font-weight="bold" fill="#d93025">闸 / 判据</text>
  <text x="366" y="186" font-size="11" fill="#333">**G12 资产清单闸**（`confirm_assets`）：逐条官方 `exists()` —— **一条不过 → `catalog/` 一个字节都不写**</text>
  <text x="366" y="206" font-size="11" fill="#333">· **大类 key 词表**：只能填 `config/asset_categories.json` 里有的 key，不许自己造（这条**不在 G1~G12 里**，是工具内部的判据）</text>
  <text x="366" y="228" font-size="11" fill="#333">产物：`catalog/elements.json`（含场景项：地图大小 / 时段）· `asset_list.json` + `library_snapshot.json`（资产库指纹）</text>

  <!-- ============ 阶段二 ============ -->
  <rect x="50" y="260" width="280" height="140" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="66" y="286" font-size="15" font-weight="bold" fill="#1a73e8">阶段二 · 平面放置规划</text>
  <text x="66" y="310" font-size="11" fill="#333">放置表 → 出图</text>
  <text x="66" y="328" font-size="11" fill="#333">→ [人看图点头] → 锁指纹</text>
  <text x="66" y="354" font-size="11" fill="#777">一物一行、米、没有 count</text>
  <text x="66" y="376" font-size="11" fill="#137333" font-weight="bold">产物：plan_v1.json</text>
  <text x="66" y="392" font-size="11" fill="#137333" font-weight="bold">+ 验收台账</text>

  <rect x="350" y="260" width="970" height="140" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="282" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="302" font-size="11" fill="#333">`generate_plan`（整表 / `patch` 局部改）· `get_plan` · `request_plan_change` · `confirm_plan`</text>
  <text x="366" y="326" font-size="12" font-weight="bold" fill="#d93025">闸 / 判据</text>
  <text x="366" y="346" font-size="11" fill="#333">**G5 改动窗口闸**：确认过之后再改内容，必须先留「改什么 / 谁要的」　**G9 越界体检**：现算现报、**只报红不拦**</text>
  <text x="366" y="366" font-size="11" fill="#333">**证据链**（`confirm_plan`）：必须给**用户点头的原话**、且图**出炉 ≥ 15 s** —— 本阶段最不能绕的一条</text>
  <text x="366" y="386" font-size="11" fill="#333">**图的判据**：`plan_v1_overview*.svg` + 正文要有**当前指纹前 10 位**与**变更集那几行的 label**；**位图一律不认账**</text>
  <text x="366" y="410" font-size="11" fill="#333">产物：`views/plan_v1.json`（权威几何）· `views/acceptance.json`（谁 / 何时 / 哪一版指纹 / 用户原话）· `views/plan_v1_overview_rNN.svg`</text>

  <!-- ============ 阶段三 ============ -->
  <rect x="50" y="420" width="280" height="140" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="66" y="446" font-size="15" font-weight="bold" fill="#137333">阶段三 · 资产布局</text>
  <text x="66" y="470" font-size="11" fill="#333">指令表 → 落关卡</text>
  <text x="66" y="488" font-size="11" fill="#333">→ 读回对账</text>
  <text x="66" y="514" font-size="11" fill="#777">增量只动差异行</text>
  <text x="66" y="536" font-size="11" fill="#137333" font-weight="bold">产物：关卡 Actor</text>
  <text x="66" y="552" font-size="11" fill="#137333" font-weight="bold">+ 搭建台账</text>

  <rect x="350" y="420" width="970" height="140" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="442" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="462" font-size="11" fill="#333">`check_build_target`（先问"搭哪张图"）· `generate_build_orders`（离线翻译件）· `execute_build`（`mode` / `dry_run` / `adopt` / `verify` / `accept_user_edits`）</text>
  <text x="366" y="486" font-size="12" font-weight="bold" fill="#d93025">闸（全在**动手之前**，一个 Actor 都不动）</text>
  <text x="366" y="506" font-size="11" fill="#333">**G1 开场前置**（`official_status` + `get_asset_list`）· **G2 搭哪张图**（没拿到用户答复 → 拒收）· **G3 阶段二闸门**（确认 + 指纹）· **G4 回读闸**（`get_plan` 的钥匙）</text>
  <text x="366" y="526" font-size="11" fill="#333">**G6 整批校验**（资产路径 `exists()` / 白膜自洽 / 行数对齐 —— 一条不过 → 一个都不落）· **G8 全量保护**（`mode="full"` 还要 `force_full=true`）</text>
  <text x="366" y="546" font-size="11" fill="#333">**G7 人工痕迹闸**：关卡现状与台账不符的行 **默认拒收并列出来**；⚠ 演练 / 全量扫全表，**纯增量只扫"会被删 / 重摆"的行**</text>
  <text x="366" y="568" font-size="12" font-weight="bold" fill="#137333">产物 / 读回</text>
  <text x="366" y="586" font-size="11" fill="#333">`build_state_v1.json`（每行记 Actor 引用；`readback` = 读过 / **`verified` = 对上了** / `mismatch`）· 五层顺序归代码（`BUILD_LAYERS`）· 落完**自动补材质**（`[完工-19]`）</text>

  <!-- ============ 阶段四 ============ -->
  <rect x="50" y="580" width="280" height="120" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="2"/>
  <text x="66" y="606" font-size="15" font-weight="bold" fill="#7b1fa2">阶段四 · 导出 / 交换</text>
  <text x="66" y="630" font-size="11" fill="#333">关卡布局 → 与 DCC</text>
  <text x="66" y="648" font-size="11" fill="#333">无关的场景描述</text>
  <text x="66" y="672" font-size="11" fill="#777">服务"Blender ↔ UE 互搬"</text>
  <text x="66" y="692" font-size="11" fill="#7b1fa2" font-weight="bold">产物：views/exchange/</text>

  <rect x="350" y="580" width="970" height="120" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="602" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="622" font-size="11" fill="#333">`export_layout`（JSON 主文件 + CSV；给了 `ue_dir` 再经官方写一份进 UE `Saved/`）· `check_exchange`（**只读**对账）</text>
  <text x="366" y="646" font-size="12" font-weight="bold" fill="#5f6368">闸</text>
  <text x="366" y="666" font-size="11" fill="#333">**没有闸**（属"故意没闸"那几处：它不改东西）。⚠ 但**单向**：外部改了这份文件**不会回到 plan** —— 要落到 plan 必须走阶段二那一整轮</text>
  <text x="366" y="688" font-size="11" fill="#333">产物：`views/exchange/scene_v1.json` + `.csv`（语义 + 尺寸 + 变换 + 材质 + 层；**不含几何** —— 官方没有 glTF / FBX / 场景导出）</text>

  <!-- ============ 阶段五 ============ -->
  <rect x="50" y="720" width="280" height="120" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="66" y="746" font-size="15" font-weight="bold" fill="#137333">阶段五 · 表面材质</text>
  <text x="66" y="770" font-size="11" fill="#333">给白膜贴材质</text>
  <text x="66" y="788" font-size="11" fill="#333">（不贴就是灰白模）</text>
  <text x="66" y="812" font-size="11" fill="#777">落完会自动补一次</text>
  <text x="66" y="832" font-size="11" fill="#137333" font-weight="bold">产物：组件材质覆盖</text>

  <rect x="350" y="720" width="970" height="120" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="742" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="762" font-size="11" fill="#333">`apply_surfaces`（阶段五本体）· ⚠ `execute_build` 落完**自动补**（`[完工-19]`，已实测：重摆的白膜 11 行 → 新贴 11 / 没成 0）</text>
  <text x="366" y="786" font-size="12" font-weight="bold" fill="#d93025">闸</text>
  <text x="366" y="806" font-size="11" fill="#333">**G10 材质路径闸**：材质表缺了 / 坏了 / 某条 `exists()` 不过 —— 那一次**一个组件都不贴**。⚠ 贴的是**组件级覆盖**、**不改资产**</text>
  <text x="366" y="828" font-size="11" fill="#333">产物：关卡组件的 `overrideMaterials` · 材质表在 `config/surface_materials.json`（**每次调用重读**：改它不用改代码、不用重启）</text>

  <!-- ============ 阶段六 ============ -->
  <rect x="50" y="860" width="280" height="120" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="66" y="886" font-size="15" font-weight="bold" fill="#137333">阶段六 · 环境搭建</text>
  <text x="66" y="910" font-size="11" fill="#333">按时段配**整套**环境</text>
  <text x="66" y="928" font-size="11" fill="#333">（不只灯光）</text>
  <text x="66" y="952" font-size="11" fill="#777">验收＝人在 UE 里自己看</text>
  <text x="66" y="972" font-size="11" fill="#137333" font-weight="bold">产物：环境台账（可回滚）</text>

  <rect x="350" y="860" width="970" height="120" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="882" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="902" font-size="11" fill="#333">`setup_environment`（`preset` / `factors` / `actors` / `overrides` / `restore`）　⚠ **出图不在这里** —— 2026-09-29 已划给阶段七</text>
  <text x="366" y="926" font-size="12" font-weight="bold" fill="#d93025">闸 / 纪律</text>
  <text x="366" y="946" font-size="11" fill="#333">**G11 环境回滚**（`restore=true` 靠台账）· **命中多个不猜**（跳过并列出来；这条**不在 G1~G12 里**，是工具内部的判据）</text>
  <text x="366" y="966" font-size="11" fill="#333">· **整份写**（结构体整体替换；变换不给的字段会被打成默认值 —— 实测）· **执行顺序归代码**（`ENV_FACTOR_ORDER`：太阳 → 大气 → 天光 → 高度雾 → 局部体积雾 → 体积云 → 后处理）</text>
  <text x="366" y="984" font-size="11" fill="#333">产物：关卡环境 Actor 属性 · `views/environment_state_v1.json`（回滚依据）· 预设表 `config/environments.json`（每次调用重读）</text>

  <!-- ============ 阶段七 ============ -->
  <rect x="50" y="1000" width="280" height="140" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
  <text x="66" y="1026" font-size="15" font-weight="bold" fill="#d93025">阶段七 · 评估与闭环</text>
  <text x="66" y="1050" font-size="11" fill="#333">出图 + 落位对账</text>
  <text x="66" y="1068" font-size="11" fill="#333">→ PASS / FAIL</text>
  <text x="66" y="1094" font-size="11" fill="#777">只报数、不判合格</text>
  <text x="66" y="1116" font-size="11" fill="#d93025" font-weight="bold">产物：预览图 + 对账报告</text>

  <rect x="350" y="1000" width="970" height="140" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="366" y="1022" font-size="12" font-weight="bold" fill="#1a73e8">工具</text>
  <text x="366" y="1042" font-size="11" fill="#333">`capture_preview`（按世界坐标摆机位出图，**不动你的视口相机**）· `evaluate_layout`（plan ↔ 台账 ↔ 关卡 三方逐行比）</text>
  <text x="366" y="1066" font-size="12" font-weight="bold" fill="#5f6368">闸</text>
  <text x="366" y="1086" font-size="11" fill="#333">**两台都是只读的，没有闸**（属"故意没闸"：不判合格、不改任何东西）。UE 连不上时只出"plan ↔ 台账"那半，并在 `warnings` 里**点名关卡那一维这次没查**</text>
  <text x="366" y="1110" font-size="12" font-weight="bold" fill="#d93025">FAIL 之后（**已知缺口**）</text>
  <text x="366" y="1130" font-size="11" fill="#333">**只报不修、没有回滚**：不中止后续行、台账照写（写的是**读回来的真实值**）；报文逐条点名 + 「🔴 这不是 PASS」。做不到回滚的原因：落一行 = 删 + 重建，旧 Actor 恢复不了</text>
  <text x="366" y="1148" font-size="11" fill="#333">产物：`views/preview/*.png` · `views/evaluate_v1.json`</text>

  <!-- ============ 结束 ============ -->
  <rect x="50" y="1170" width="1270" height="66" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="66" y="1196" font-size="14" font-weight="bold" fill="#3c4043">结束 · 存不存盘由人在 UE 里决定</text>
  <text x="66" y="1218" font-size="11" fill="#333">19 个工具**从不调任何 save 类官方工具**；关卡脏没脏看 UE 标题栏的未保存标记。⚠ 关掉不保存 = 这一整套操作等于没发生（仍可从 plan 重建）。</text>

  <!-- 主干箭头 -->
  <line x1="190" y1="240" x2="190" y2="258" stroke="#1a73e8" stroke-width="2"/><polygon points="190,266 185,256 195,256" fill="#1a73e8"/>
  <line x1="190" y1="400" x2="190" y2="418" stroke="#1a73e8" stroke-width="2"/><polygon points="190,426 185,416 195,416" fill="#1a73e8"/>
  <line x1="190" y1="560" x2="190" y2="578" stroke="#137333" stroke-width="2"/><polygon points="190,586 185,576 195,576" fill="#137333"/>
  <line x1="190" y1="700" x2="190" y2="718" stroke="#7b1fa2" stroke-width="2"/><polygon points="190,726 185,716 195,716" fill="#7b1fa2"/>
  <line x1="190" y1="840" x2="190" y2="858" stroke="#137333" stroke-width="2"/><polygon points="190,866 185,856 195,856" fill="#137333"/>
  <line x1="190" y1="980" x2="190" y2="998" stroke="#137333" stroke-width="2"/><polygon points="190,1006 185,996 195,996" fill="#137333"/>
  <line x1="190" y1="1140" x2="190" y2="1168" stroke="#d93025" stroke-width="2"/><polygon points="190,1176 185,1166 195,1166" fill="#d93025"/>

  <!-- 闭环：阶段七 FAIL → 阶段二 -->
  <path d="M 40 1070 L 22 1070 L 22 330 L 48 330" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="56,330 46,325 46,335" fill="#d93025"/>
  <text x="14" y="700" font-size="11" font-weight="bold" fill="#d93025" transform="rotate(-90 14 700)">FAIL / 还想改 → 回阶段二（记改动 → 补丁 → 重画图 → 再点头 → 再落）</text>

  <!-- 图例 -->
  <rect x="50" y="1256" width="1270" height="200" rx="8" fill="#fff" stroke="#dadce0" stroke-dasharray="4,3"/>
  <text x="66" y="1280" font-size="13" font-weight="bold" fill="#111">读法</text>
  <text x="66" y="1302" font-size="11" fill="#333">· **左列是状态推进**：阶段一 → 二 → 三 是一条脊柱；**四 / 五 / 六 都在"已搭好的关卡"上做事、彼此不依赖**；阶段七是**唯一的评估口**。右列是这一阶段的工具 / 闸 / 产物。</text>
  <text x="66" y="1322" font-size="11" fill="#333">· **被拦的时候**：去右列找你就差的那一步 —— 那里写着是哪道闸（有 G 号的给 G 号）、判据是什么、产物落在哪个文件。</text>
  <text x="66" y="1342" font-size="11" fill="#a60">· ⚠ **只有一套编号**：`G1~G12` 在 `docs/全流程-闸门地图.md`，本图**只引用、不自造**。另有"**故意没闸**"那 6 处（导出 / 出图 / 对账这些**只读**件 —— 没闸是因为它们不改东西）。</text>
  <text x="66" y="1362" font-size="11" fill="#333">· ⚠ 另有 4 条**不在 G1~G12 里**的判据，本图已就地标明：大类 `key` 词表 · 图的判据 · 证据链（原话 + 15 s）· 环境"命中多个不猜"。它们是各工具**自己内部**的判据。</text>
  <text x="66" y="1382" font-size="11" fill="#a60">· ⚠ 两种"人点头"长得像但不同：**阶段一的两次**是"清单对不对"，**阶段二那次**是"几何对不对 + **必须给原话**"（证据链）。</text>
  <text x="66" y="1402" font-size="11" fill="#333">· ⚠ **阶段七的评估不是闸**：它只报数、不判合格；"合不合格"由你看了图说了算。若将来要它判，得先定判据 —— 判据错的时候，绿灯比红灯更坏。</text>
  <text x="66" y="1426" font-size="11" fill="#777">· 本图由 AI 按代码与文档现画（2026-09-30）。工具名 / 行号会漂移时**以代码为准**。配套：`docs/工具面审计.md` · `docs/模块边界设计.md` · `docs/代码地图.md`。</text>
</svg>
