[FilterPlugin]
; UEPLANE — FilterPlugin.ini
;
; 这个文件的作用：告诉 UAT 的 BuildPlugin「**标准插件结构之外**、还必须随包发」的文件/目录。
; （写法照官方 VibeUE 的 Config/FilterPlugin.ini —— 它把下面这三档规则写成了注释，很值得抄。）
;
; ── UAT BuildPlugin **自动包含**，不用在这里列 ──
;     - the .uplugin
;     - Source/
;     - Content/
;     - Resources/
;
; ── **自动排除**（构建产物 / 目标机自己会重建）──
;     - Binaries/
;     - Intermediate/
;
; ── 其余一切（顶层文件、Config/ 下的东西等）**不显式列就不进包** ──
;
; ⚠ 本插件是**纯 Python**（`Modules: []`），业务代码全在 `Content/Python/` 下 ——
;   那属于 Content/，**自动进包**，不用在这里列。

; 顶层说明文件（面向买家）
/README.md
/PROMPT.md

; 商业发布必备（2026-10-17 加）：许可证 / 第三方声明（three.js MIT）/ 变更日志
/LICENSE.md
/THIRD_PARTY_NOTICES.md
/CHANGELOG.md

; 场景规范（2026-10-17）：**机器读的是 Python 里的 toolset 说明**（ueplane/tools.py 那段「场景规范」），
;   这份 MD 是给人看的正文，留着一起发；Tools/ 是页面模板的壳与内联生成脚本，
;   改页面 / 换 three 版本时要靠它们重生成 `planning/web/preview3d.html`。
/STANDARD.md
/Tools/

