[project]
name = "mcp-server"
version = "0.9.3"
description = "UEPLANE · 参考图驱动的 UE 场景搭建编排层（MCP server）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2.0",
    # src/mcp_server/main.py 直接用 anyio 起 task group、等信号（事件）。
    # anyio 本来就是 mcp 的硬依赖，这里**显式声明**，免得将来依赖树变了就断。
    "anyio>=4.0",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
