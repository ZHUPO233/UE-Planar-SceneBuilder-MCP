  <text x="60" y="782" fill="#8fa3b8" font-size="13">图内指纹 ecd6f40890 ｜ 本轮只新增 1 行（世界地基）；其余 89 行第 23 轮已确认、本轮不重复确认 ｜ 本图由 AI 按 views/plan_v1.json 手绘</text>
