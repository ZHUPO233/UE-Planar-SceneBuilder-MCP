  </g>

  <rect x="960" y="566" width="380" height="94" fill="#2a2416" stroke="#ffd479" stroke-width="1.2"/>
  <text x="972" y="586" fill="#ffd479" font-size="12.5">⚠ 一处我没把握，请你拍：</text>
  <text x="972" y="606" fill="#c8d4e0" font-size="12">地基厚 20 cm → 底面在 −5 cm，而车行道底面在 −15 cm，</text>
